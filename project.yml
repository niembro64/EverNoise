name: JustBrownNoise
options:
  bundleIdPrefix: io.niemo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  BrownNoiseCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "24"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 82F3X3VDHP
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  EverNoiseTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes: [ContentView.swift, JustBrownNoiseApp.swift, PrivacyView.swift, BandNotchPicker.swift, Info.plist]
      - path: TVApp
    dependencies:
      - package: BrownNoiseCore
        product: BrownNoiseDSP
      - package: BrownNoiseCore
        product: PlaybackCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.niemo.JustBrownNoise
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: EverNoise
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIBackgroundModes: [audio]
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
    attributes:
      SystemCapabilities:
        com.apple.BackgroundModes:
          enabled: 1
  JustBrownNoise:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: BrownNoiseCore
        product: BrownNoiseDSP
      - package: BrownNoiseCore
        product: PlaybackCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.niemo.JustBrownNoise
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
    attributes:
      SystemCapabilities:
        com.apple.BackgroundModes:
          enabled: 1
  EverNoiseTVIntegrationTests:
    type: bundle.unit-test
    platform: tvOS
    deploymentTarget: "17.0"
    sources: [IntegrationTests/AudioDriverTests.swift]
    dependencies:
      - target: EverNoiseTV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.niemo.JustBrownNoise.TVIntegrationTests
  EverNoiseTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    deploymentTarget: "17.0"
    sources: [TVUITests]
    dependencies:
      - target: EverNoiseTV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.niemo.JustBrownNoise.TVUITests
  JustBrownNoiseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: JustBrownNoise
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.niemo.JustBrownNoise.UITests
  JustBrownNoiseIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources: [IntegrationTests]
    dependencies:
      - target: JustBrownNoise
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.niemo.JustBrownNoise.IntegrationTests
schemes:
  EverNoiseTV:
    build:
      targets:
        EverNoiseTV: all
        EverNoiseTVIntegrationTests: [test]
        EverNoiseTVUITests: [test]
    test:
      targets: [EverNoiseTVIntegrationTests, EverNoiseTVUITests]
    run:
      config: Debug
    archive:
      config: Release
  JustBrownNoise:
    build:
      targets:
        JustBrownNoise: all
        JustBrownNoiseUITests: [test]
        JustBrownNoiseIntegrationTests: [test]
    test:
      targets: [JustBrownNoiseIntegrationTests, JustBrownNoiseUITests]
    run:
      config: Debug
    archive:
      config: Release
