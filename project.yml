name: JustBrownNoise
options:
  bundleIdPrefix: io.niemo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  BrownNoiseCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "22"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 82F3X3VDHP
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  JustBrownNoise:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: BrownNoiseCore
        product: BrownNoiseDSP
      - package: BrownNoiseCore
        product: PlaybackCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.niemo.JustBrownNoise
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
    attributes:
      SystemCapabilities:
        com.apple.BackgroundModes:
          enabled: 1
  JustBrownNoiseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: JustBrownNoise
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.niemo.JustBrownNoise.UITests
  JustBrownNoiseIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources: [IntegrationTests]
    dependencies:
      - target: JustBrownNoise
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.niemo.JustBrownNoise.IntegrationTests
schemes:
  JustBrownNoise:
    build:
      targets:
        JustBrownNoise: all
        JustBrownNoiseUITests: [test]
        JustBrownNoiseIntegrationTests: [test]
    test:
      targets: [JustBrownNoiseIntegrationTests, JustBrownNoiseUITests]
    run:
      config: Debug
    archive:
      config: Release
